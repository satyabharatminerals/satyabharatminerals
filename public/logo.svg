<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 270" fill="none" role="img" aria-label="Satya Bharat Minerals Logo">
  <title>Satya Bharat Minerals</title>

  <!-- ── Layer 1: Outer red hexagon ── -->
  <polygon
    points="145,22 190,100 145,178 55,178 10,100 55,22"
    fill="#CC1515"
  />

  <!-- ── Layer 2: White ring ── -->
  <polygon
    points="140,31 180,100 140,169 60,169 20,100 60,31"
    fill="white"
  />

  <!-- ── Layer 3: Inner red content area ── -->
  <polygon
    points="135,39 170,100 135,161 65,161 30,100 65,39"
    fill="#CC1515"
  />

  <!-- ── White V-triangle ── -->
  <polyline
    points="65,39 100,72 135,39"
    fill="none"
    stroke="white"
    stroke-width="6"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- ── White horizontal separator ── -->
  <line x1="30" y1="108" x2="170" y2="108" stroke="white" stroke-width="6" stroke-linecap="round"/>

  <!-- ── SBM text ── -->
  <text
    x="100" y="152"
    font-family="'Arial Black','Arial Bold',Arial,Helvetica,sans-serif"
    font-size="52"
    font-weight="900"
    fill="white"
    text-anchor="middle"
    letter-spacing="-1"
  >SBM</text>

  <!-- ── Company name ── -->
  <text
    x="100" y="207"
    font-family="'Arial Black','Arial Bold',Arial,Helvetica,sans-serif"
    font-size="13"
    font-weight="900"
    fill="#CC1515"
    text-anchor="middle"
    letter-spacing="1.5"
  >SATYA BHARAT MINERALS</text>

  <!-- ── Tagline ── -->
  <text
    x="100" y="228"
    font-family="Georgia,'Times New Roman',serif"
    font-size="11"
    font-style="italic"
    fill="#CC1515"
    text-anchor="middle"
  >Lime For Everyday Life.</text>
</svg>
